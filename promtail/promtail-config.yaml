server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Authentification / SSH
  - job_name: auth
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth
          host: linux-server
          __path__: /var/log/auth.log

  # Logs systeme generaux
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: linux-server
          __path__: /var/log/syslog

  # Logs nginx (adapter le chemin si tu ajoutes un conteneur nginx)
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          host: linux-server
          __path__: /var/log/nginx/*.log
